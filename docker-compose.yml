version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Proxy corporativo (opcional): toma HTTP_PROXY/HTTPS_PROXY/NO_PROXY del
      # entorno donde corres `docker compose build`/`up`. Si no están definidas
      # localmente, quedan vacías y el build funciona igual sin proxy.
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: poc-emision-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/tmp:/app/tmp
      # Storage local de la PoC (CSV de casos + volumen de documentos por folio),
      # compartido entre el frontend de bróker y el de suscriptor vía el backend.
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/poc-emision-frontend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: poc-emision-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-suscriptor:
    build:
      context: ./frontend_suscriptor/poc-emision-frontend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: poc-emision-frontend-suscriptor
    ports:
      - "4201:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: poc-emision-network