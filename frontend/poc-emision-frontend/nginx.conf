server {
    listen 80;

    # Proxy de /api hacia el backend (mismo prefijo que usa proxy.conf.json
    # con `ng serve` en desarrollo). Sin este bloque, en producción (build
    # estático servido por este mismo Nginx) los fetch a "/api/..." caían en
    # el location "/" de abajo y devolvían el index.html de Angular en vez de
    # llegar al backend — por eso el login parecía "no redirigir al backend".
    #
    # "backend" es el nombre del servicio en docker-compose.yml; Docker
    # resuelve ese hostname dentro de la red interna del compose.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier otra ruta cae al index.html de Angular.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}