<div class="app-shell" [class.menu-colapsado]="menuColapsado">
  <header class="app-header">
    <div class="header-left">
      <button
        class="collapse-button"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="!menuColapsado"
        [attr.aria-label]="menuColapsado ? 'Expandir menú' : 'Colapsar menú'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="brand">
        <span class="brand-mark">PS</span>
        <div class="brand-copy">
          <strong>Portal de Suscripción</strong>
          <small>GMM Colectivo · Interno</small>
        </div>
      </div>
    </div>

    <div class="header-right">
      <div class="open-counter">
        <span class="counter-label">Abiertos</span>
        <strong>{{ totalAbiertos }}</strong>
      </div>

      <div class="header-user" [attr.title]="username">
        <span class="user-avatar">{{ username.charAt(0) || 'S' }}</span>
        <span class="user-name">{{ username }}</span>
      </div>

      <button class="btn-logout" type="button" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Salir</span>
      </button>
    </div>
  </header>

  <div class="shell-body">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <button type="button" class="nav-item" [class.active]="seccionActiva === 'bandeja'" (click)="irASeccion('bandeja')" [attr.title]="menuColapsado ? 'Bandeja de revisión' : null">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 12h-6l-2 3h-4l-2-3H2"></path>
            <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"></path>
          </svg>
          <span *ngIf="!menuColapsado">Bandeja de revisión</span>
        </button>

        <button type="button" class="nav-item" [class.active]="seccionActiva === 'historial'" (click)="irASeccion('historial')" [attr.title]="menuColapsado ? 'Historial' : null">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <span *ngIf="!menuColapsado">Historial</span>
        </button>
      </nav>
    </aside>

    <div class="dashboard-main">
      <main class="dashboard-content">
        <div class="page-header" *ngIf="titulo">
          <h1>{{ titulo }}</h1>
          <p class="page-subtitle" *ngIf="subtitulo">{{ subtitulo }}</p>
        </div>

        <ng-content></ng-content>
      </main>
    </div>
  </div>
</div>
