<div class="dashboard-shell" [class.menu-colapsado]="menuColapsado">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-copy" *ngIf="!menuColapsado">
        <strong>Portal de Suscripción</strong>
        <small>GMM Colectivo · Interno</small>
      </div>
      <button
        class="collapse-button"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="!menuColapsado"
        [attr.aria-label]="menuColapsado ? 'Expandir menú' : 'Colapsar menú'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
          <line x1="9.5" y1="4" x2="9.5" y2="20"></line>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <button type="button" class="nav-item" [class.active]="seccionActiva === 'bandeja'" (click)="irASeccion('bandeja')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 12h-6l-2 3h-4l-2-3H2"></path>
          <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"></path>
        </svg>
        <span *ngIf="!menuColapsado">Bandeja de revisión</span>
      </button>

      <button type="button" class="nav-item" [class.active]="seccionActiva === 'historial'" (click)="irASeccion('historial')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span *ngIf="!menuColapsado">Historial</span>
      </button>
    </nav>

    <div class="sidebar-user" [attr.title]="menuColapsado ? username : null">
      <span class="user-avatar">{{ username.charAt(0) || 'S' }}</span>
      <div *ngIf="!menuColapsado">
        <strong>{{ username }}</strong>
        <small>Suscriptor</small>
      </div>
    </div>
  </aside>

  <div class="dashboard-main">
    <header class="topbar">
      <div>
        <p class="eyebrow">Portal de suscripción</p>
        <h1>{{ titulo }}</h1>
        <p class="topbar-copy" *ngIf="subtitulo">{{ subtitulo }}</p>
      </div>

      <div class="topbar-actions">
        <div class="open-counter">
          <span class="counter-label">Casos abiertos</span>
          <strong>{{ totalAbiertos }}</strong>
        </div>
        <button class="btn-logout" type="button" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Salir
        </button>
      </div>
    </header>

    <main class="dashboard-content">
      <ng-content></ng-content>
    </main>
  </div>
</div>
